<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Routina — Account Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #030712;
      --surface: rgba(15, 23, 42, 0.95);
      --primary: #22d3ee;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    p { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .status-loading { color: var(--primary); }
    .status-success { color: #34d399; }
    .status-error { color: #f87171; }
  </style>
</head>
<body>

  <div class="card">
    <div id="icon" class="icon">⏳</div>
    <h1 id="title">Verifying your email...</h1>
    <p id="message">Please wait a moment while we confirm your email address.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    const firebaseConfig = {
    apiKey: "AIzaSyCNcnMRsp2IgNxENUb9gKdMK9TGqwJv5Vs",
    authDomain: "my-routina-app.firebaseapp.com",
    projectId: "my-routina-app",
    storageBucket: "my-routina-app.firebasestorage.app",
    messagingSenderId: "370947315001",
    appId: "1:370947315001:web:2eb7ab4e9590e6052804e8"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const oobCode = urlParams.get('oobCode');

    const iconEl = document.getElementById('icon');
    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');

    if (mode === 'verifyEmail' && oobCode) {
      applyActionCode(auth, oobCode)
        .then(() => {
          iconEl.textContent = '✅';
          titleEl.textContent = 'Email Verified!';
          titleEl.className = 'status-success';
          messageEl.textContent = 'Your email has been successfully verified. You can now return to the Routina app and log in.';
        })
        .catch((error) => {
          iconEl.textContent = '❌';
          titleEl.textContent = 'Verification Failed';
          titleEl.className = 'status-error';
          messageEl.textContent = 'This verification link is invalid or has expired. Please request a new one from the app.';
        });
    } else {
      iconEl.textContent = '⚠️';
      titleEl.textContent = 'Invalid Request';
      messageEl.textContent = 'No verification code was provided in the link.';
    }
  </script>

</body>
</html>
